services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  postgres-read-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_read_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./src/infrastructure/postgres/read/read-schema.sql:/docker-entrypoint-initdb.d/01-read-schema.sql

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
