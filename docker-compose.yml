services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  postgres-read:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_read
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_read_data:/var/lib/postgresql/data
      - ./src/infrastructure/postgres/read/read-schema.sql:/docker-entrypoint-initdb.d/01-read-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  postgres_read_data:
  redis_data:
